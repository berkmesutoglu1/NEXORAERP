{% extends "base.html" %}
{% block title %}Stok Düzeltme / Fire - NEXORA ERP{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1">Manuel Stok Düzeltme ve Fire Girişi</h4>
    <p class="text-muted small mb-0">Sayım fazlası, sayım eksiği veya fire/zayi kaydı</p>
  </div>
  <a href="{{ url_for('inventory.movements') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Stok Logları</a>
</div>

<div class="erp-card p-4 col-12 col-lg-8 mx-auto">
  <form method="POST" action="{{ url_for('inventory.adjust') }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-medium small">İşlem Yapılacak Depo *</label>
        <select name="warehouse_id" class="form-select" required>
          {% for w in warehouses %}
            <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-medium small">İşlem Türü *</label>
        <select name="adjustment_type" class="form-select" required>
          <option value="MANUEL_GIRIS">Manuel Stok Girişi (+)</option>
          <option value="MANUEL_CIKIS">Manuel Stok Çıkışı (-)</option>
          <option value="FIRE">Fire / Bozuk Ürün Zayii (-)</option>
        </select>
      </div>

      <div class="col-md-8">
        <label class="form-label fw-medium small">Ürün *</label>
        <select name="product_id" class="form-select" required>
          {% for p in products %}
            <option value="{{ p.id }}">{{ p.code }} - {{ p.name }} (Mevcut: {{ p.total_stock }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-medium small">Miktar *</label>
        <input type="number" step="0.1" name="quantity" class="form-control" placeholder="0.0" required>
      </div>

      <div class="col-12">
        <label class="form-label fw-medium small">Düzeltme Sebebi / Açıklama *</label>
        <textarea name="notes" class="form-control" rows="2" placeholder="Örn: Haftalık depo sayımı farkı veya kırık paket fire ayrımı" required></textarea>
      </div>

      <div class="col-12 mt-4 text-end">
        <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-shield-check me-2"></i>Düzeltmeyi Kaydet ve Logla</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
